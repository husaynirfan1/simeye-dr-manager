{% extends "base.html" %}

{% block title %}Login - DR Deficiency Management{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <span class="material-icons-round">login</span>
                    Login
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                            <input type="text" name="{{ form.username.name }}"
                                   class="form-control" id="{{ form.username.id_for_label }}"
                                   placeholder="Enter your username" required>
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                            <input type="password" name="{{ form.password.name }}"
                                   class="form-control" id="{{ form.password.id_for_label }}"
                                   placeholder="Enter your password" required>
                        </div>
                        {% if form.errors %}
                            <div class="alert alert-error">
                                <span class="material-icons-round">error</span>
                                Please enter a correct username and password.
                            </div>
                        {% endif %}
                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
